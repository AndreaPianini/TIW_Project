<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Gestione Esami</title>
	<link rel="stylesheet" href="css/loginStyle.css" />
	<script src="JS/LoginController.js" charset="utf-8" defer></script>
</head>
<body>
	<div class="container">
		<h2>Accedi al sistema</h2>

		<form action="CheckLogin" method="POST">
			<div class="form-group">
				<label for="id">IDwergbwor</label>
				<input type="text" id="id" name="id" required>
			</div>

			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" required>
			</div>

			<div id="error-message" class="error-message" style="display:none;">
				<p id="error-text"></p>
			</div>

			<button id="login-button" type="submit" class="btn-primary">Login</button>
		</form>
	</div>
</body>
</html>
