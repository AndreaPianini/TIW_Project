<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Iscritti all'Appello</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="container">
    <h2>Iscritti all'appello</h2>

    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>

    <div th:if="${error == null}">
        <table class="table">
            <thead>
                <tr>
    <!-- Matricola -->
    <th th:if="${order=='DESC'} or ${sortBy!='matricola'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='matricola',order='ASC')}">Matricola</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='matricola'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='matricola',order='DESC')}">Matricola</a>
    </th>

    <!-- Cognome -->
    <th th:if="${order=='DESC'} or ${sortBy!='cognome'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='cognome',order='ASC')}">Cognome</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='cognome'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='cognome',order='DESC')}">Cognome</a>
    </th>

    <!-- Nome -->
    <th th:if="${order=='DESC'} or ${sortBy!='nome'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='nome',order='ASC')}">Nome</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='nome'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='nome',order='DESC')}">Nome</a>
    </th>

    <!-- Email -->
    <th th:if="${order=='DESC'} or ${sortBy!='email'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='email',order='ASC')}">Email</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='email'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='email',order='DESC')}">Email</a>
    </th>

    <!-- Corso di Laurea -->
    <th th:if="${order=='DESC'} or ${sortBy!='corsoLaurea'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='corsoLaurea',order='ASC')}">Corso di Laurea</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='corsoLaurea'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='corsoLaurea',order='DESC')}">Corso di Laurea</a>
    </th>

    <!-- Voto -->
    <th th:if="${order=='DESC'} or ${sortBy!='voto'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='voto',order='ASC')}">Voto</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='voto'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='voto',order='DESC')}">Voto</a>
    </th>

    <!-- Stato -->
    <th th:if="${order=='DESC'} or ${sortBy!='stato'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='stato',order='ASC')}">Stato</a>
    </th>
    <th th:if="${order=='ASC'} and ${sortBy=='stato'}">
        <a th:href="@{/VediIscritti(dataAppello=${dataAppello},corsoID=${corsoID},sortBy='stato',order='DESC')}">Stato</a>
    </th>
    <th></th>
</tr>

            </thead>
            <tbody>
                <tr th:each="stud, iterStat : ${iscritti}">
                    <td th:text="${stud.matricola}"></td>
                    <td th:text="${stud.cognome}"></td>
                    <td th:text="${stud.nome}"></td>
                    <td th:text="${stud.email}"></td>
                    <td th:text="${stud.corsoLaurea}"></td>
                    <td th:text="${voti[iterStat.index].voto != null ? voti[iterStat.index].voto.toString() : '-'}"></td>
                    <td th:text="${voti[iterStat.index].statoValutazione != null ? voti[iterStat.index].statoValutazione.toString() : ''}"></td>
                    <td>
                        <form th:if="${voti[iterStat.index].statoValutazione != null and 
                         (voti[iterStat.index].statoValutazione.name() == 'NON_INSERITO' or 
                          voti[iterStat.index].statoValutazione.name() == 'INSERITO')
                        }"
                              th:action="@{/Modifica}" method="get" style="display:inline;">
                            <input type="hidden" name="studenteID" th:value="${stud.id}" />
                            <input type="hidden" name="corsoID" th:value="${corsoID}" />
                            <input type="hidden" name="dataAppello" th:value="${dataAppello}" />
                            <button type="submit" class="btn-primary">Modifica</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <form th:action="@{/Pubblica}" method="post" style="margin-top: 20px;">
            <input type="hidden" name="corsoID" th:value="${corsoID}" />
            <input type="hidden" name="dataAppello" th:value="${dataAppello}" />
            <button type="submit" class="btn-warning">Pubblica</button>
        </form>
        <form th:action="@{/Verbalizza}" method="post" style="margin-top: 20px;">
            <input type="hidden" name="corsoID" th:value="${corsoID}" />
            <input type="hidden" name="dataAppello" th:value="${dataAppello}" />
            <button type="submit" class="btn-warning">Verbalizza</button>
        </form>
    </div>
    <form th:action="@{/VaiHomeDocente}" method="get" style="margin-top: 20px;">
        <button type="submit" class="btn-secondary">Torna alla Home</button>
    </form>
</div>
</body>
</html>
